name: Build dictionary

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes to spend (350 is the most GitHub allows)'
        default: '300'
      pages:
        description: 'Words to read this run (0 means as many as fit)'
        default: '0'
      fresh:
        description: 'Throw away previous progress and start again'
        type: boolean
        default: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the two libraries the script needs
        run: pip install requests beautifulsoup4

      - name: Read signbsl.com
        run: >
          python3 tools/crawl.py
          --minutes ${{ inputs.minutes }}
          --pages ${{ inputs.pages }}
          ${{ inputs.fresh == true && '--fresh' || '' }}

      - name: Save the result back to the repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update dictionary ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          fi
